<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Градиенты — Андрей Одокиенко</title>
    <meta
      name="description"
      content="Конструктор зернистых градиентов: форма, цвета, шум и случайные сочетания. Экспорт в PNG и JPEG в 1x, 2x и 4x."
    />
    <link rel="canonical" href="https://odokienko.ru/gradient/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Андрей Одокиенко" />
    <meta property="og:title" content="Градиенты — Андрей Одокиенко" />
    <meta
      property="og:description"
      content="Конструктор зернистых градиентов: форма, цвета, шум и случайные сочетания. Экспорт в PNG и JPEG."
    />
    <meta property="og:url" content="https://odokienko.ru/gradient/" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="theme-color" content="#000000" />
    <script>
      // No-flash: apply the saved theme before first paint (default stays dark).
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gradient/main.tsx"></script>
  </body>
</html>
