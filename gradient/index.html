<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Конструктор градиентов</title>
    <meta name="description" content="Посмотри, что я собрал" />
    <link rel="canonical" href="https://odokienko.ru/gradient/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Андрей Одокиенко" />
    <meta property="og:title" content="Конструктор градиентов" />
    <meta property="og:description" content="Посмотри, что я собрал" />
    <meta property="og:url" content="https://odokienko.ru/gradient/" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:image" content="https://odokienko.ru/og-gradient.jpg" />
    <meta property="og:image:secure_url" content="https://odokienko.ru/og-gradient.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Конструктор градиентов" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Конструктор градиентов" />
    <meta name="twitter:description" content="Посмотри, что я собрал" />
    <meta name="twitter:image" content="https://odokienko.ru/og-gradient.jpg" />
    <meta name="theme-color" content="#000000" />
    <script>
      // No-flash: apply the saved theme before first paint (default stays dark).
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gradient/main.tsx"></script>
  </body>
</html>
