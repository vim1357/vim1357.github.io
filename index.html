<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Андрей Одокиенко — продуктовый дизайн-лид и фаундер</title>
    <meta
      name="description"
      content="Андрей Одокиенко — продуктовый дизайн-лид и фаундер. Опыт в HR, банках, страховании, B2B / Enterprise SaaS: сайты, клиентские и внутренние интерфейсы, мобильные приложения, дизайн-системы."
    />
    <link rel="canonical" href="https://odokienko.ru/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Андрей Одокиенко" />
    <meta property="og:title" content="Андрей Одокиенко — продуктовый дизайн-лид и фаундер" />
    <meta
      property="og:description"
      content="Опыт в HR, банках, страховании, B2B / Enterprise SaaS. Работаю со стартапами на ранней стадии, обучаю дизайнеров и запускаю свои продукты."
    />
    <meta property="og:url" content="https://odokienko.ru/" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:image" content="https://odokienko.ru/og-cover.png" />
    <meta property="og:image:secure_url" content="https://odokienko.ru/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Андрей Одокиенко — продуктовый дизайн-лид и фаундер" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Андрей Одокиенко — продуктовый дизайн-лид и фаундер" />
    <meta
      name="twitter:description"
      content="Опыт в HR, банках, страховании, B2B / Enterprise SaaS. Работаю со стартапами на ранней стадии, обучаю дизайнеров и запускаю свои продукты."
    />
    <meta name="twitter:image" content="https://odokienko.ru/og-cover.png" />
    <meta name="theme-color" content="#000000" />
    <script>
      // No-flash: apply the saved theme before first paint (default stays dark).
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
